name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'
      - name: Run tests and check release compilation
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  device-import-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test scanned PDF import on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon --max-workers=2 --stacktrace :app:connectedDebugAndroidTest
            mkdir -p device-proof
            adb pull /sdcard/Android/data/com.nailong.quiz.study.dev/files/pdf-import-preview.png device-proof/pdf-import-preview.png
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pdf-device-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            device-proof/
          if-no-files-found: ignore
          retention-days: 14

  signed-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-and-test, device-import-test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'
      - name: Restore original signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NAILONG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          value = os.environ.get('KEYSTORE_BASE64', '').strip()
          if not value:
              raise SystemExit('Configure the original NAILONG_KEYSTORE_BASE64 repository secret first')
          key = Path(os.environ['RUNNER_TEMP']) / 'nailong-study-signing.p12'
          key.write_bytes(base64.b64decode(''.join(value.split()), validate=True))
          key.chmod(0o600)
          PYTHON
      - name: Build signed update APK
        env:
          NAILONG_KEYSTORE: ${{ runner.temp }}/nailong-study-signing.p12
          NAILONG_STORE_PASSWORD: ${{ secrets.NAILONG_STORE_PASSWORD }}
          NAILONG_KEY_ALIAS: nailongstudy
          NAILONG_KEY_PASSWORD: ${{ secrets.NAILONG_STORE_PASSWORD }}
        run: |
          test -n "$NAILONG_STORE_PASSWORD" || { echo 'Configure NAILONG_STORE_PASSWORD first'; exit 1; }
          export NAILONG_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleRelease
      - name: Verify original signature and update identity
        run: python3 scripts/verify_release.py app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nailong-quiz-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/release-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'nailong-study-signing.p12').unlink(missing_ok=True)
          PYTHON
